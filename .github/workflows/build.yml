# Builds the publications page and publishes it on GitHub Pages.
# Runs when publications.csv (or the scripts) change, every Monday to refresh
# citation counts and open-access links, and on demand from the Actions tab.
name: Build publications page

on:
  push:
    branches: [main]
    paths: ["publications.csv", "R/**", "site/**", ".github/workflows/build.yml"]
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::httr2
            any::jsonlite

      - name: Look up DOIs in OpenAlex
        env:
          OPENALEX_EMAIL: ${{ vars.OPENALEX_EMAIL }}
        run: Rscript R/fetch_metadata.R

      - name: Check list and build page
        run: Rscript R/build_site.R

      - name: Save updated metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metadata/
          git diff --cached --quiet || (git commit -m "Update OpenAlex metadata" && git push)

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

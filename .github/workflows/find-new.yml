# On the 1st of every month: look for new papers that may belong on the list
# and open an issue with them for review. Nothing is added automatically.
name: Find new publications

on:
  schedule:
    - cron: "23 10 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::httr2
            any::jsonlite

      - name: Search OpenAlex
        id: search
        env:
          OPENALEX_EMAIL: ${{ vars.OPENALEX_EMAIL }}
        run: Rscript R/find_new.R

      - name: Open an issue
        if: steps.search.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "Possible new publications ($(date +%B\ %Y))" --body-file candidates.md
